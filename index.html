<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct Mesh Booleans</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f6f9ff 0%, #dfe9ff 45%, #c7dafd 100%);
      color: #11213d;
    }

    main {
      width: min(920px, 92vw);
      padding: 3rem 1.5rem 3.5rem;
      text-align: center;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    h1 {
      font-size: clamp(2.3rem, 4.8vw, 3.8rem);
    }

    h2 {
      margin-top: 2rem;
      font-size: clamp(1.8rem, 3.8vw, 2.8rem);
    }

    .subtitle {
      margin: 0.9rem auto 0;
      max-width: 760px;
      font-size: clamp(1.03rem, 2vw, 1.25rem);
      color: #2f4268;
    }

    .title-image {
      display: block;
      width: min(760px, 90vw);
      margin: 2rem auto 0.3rem;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(17, 33, 61, 0.2);
    }

    ul {
      margin: 2.2rem auto 0;
      padding: 0;
      list-style: none;
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a {
      display: inline-block;
      text-decoration: none;
      color: #0f3278;
      background: rgba(255, 255, 255, 0.72);
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(15, 50, 120, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(15, 50, 120, 0.2);
    }
  </style>
</head>
<body>
  <main>
    <h1>Direct Mesh Booleans</h1>
    <p class="subtitle">Non-Restrictive Boolean Operations</p>
    <img class="title-image" src="images/title_image.png" alt="Direct Mesh Booleans title image">
    <h2>LeakyMesh</h2>
    <p class="subtitle">Benchmark generation framework for objective evaluation of open-surface Boolean operations.</p>
    <ul>
      <li><a href="https://github.com/RomanCizmarik/Direct-Mesh-Booleans">Original DMB</a></li>
      <li><a href="https://github.com/RomanCizmarik/Direct-Mesh-Booleans-Extension-SNCS-">DMB++ extension</a></li>
      <li><a href="https://github.com/RomanCizmarik/LeakyMesh">LeakyMesh benchmark generation framework</a></li>
    </ul>
  </main>
</body>
</html>
